# ⚠️ FORK-ONLY — DO NOT UPSTREAM.
# Temporary dev/CI shim that resolves the (not-yet-published) cs_nerva package
# tree from git: mmokhi/cs_nerva @ branch `nerva` (which ships the prebuilt
# native libs for all platforms). The upstream-clean declaration lives in the
# pubspec template's %%ENABLE_XNV%% block (cs_nerva: ^1.0.0 from pub.dev); this
# file just redirects it to the fork until cs_nerva is published, then it's
# deleted. The whole transitive tree is overridden because none are on pub.dev.
#
# (Branch ref tracks the tip during dev; pin a commit sha for a release.)
dependency_overrides:
  cs_nerva:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva}
  cs_nerva_flutter_libs:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs}
  cs_nerva_flutter_libs_platform_interface:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_platform_interface}
  cs_nerva_flutter_libs_android:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_android}
  cs_nerva_flutter_libs_android_arm64_v8a:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_android_arm64_v8a}
  cs_nerva_flutter_libs_android_armeabi_v7a:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_android_armeabi_v7a}
  cs_nerva_flutter_libs_android_x86_64:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_android_x86_64}
  cs_nerva_flutter_libs_ios:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_ios}
  cs_nerva_flutter_libs_linux:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_linux}
  cs_nerva_flutter_libs_macos:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_macos}
  cs_nerva_flutter_libs_windows:
    git: {url: https://github.com/mmokhi/cs_nerva, ref: nerva, path: cs_nerva_flutter_libs_windows}
